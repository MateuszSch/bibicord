name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Installer (BibiCord-Setup-*.exe)
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          command -v makensis || choco install nsis -y --no-progress
          scripts/build-windows-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BibiCord-windows
          path: dist/BibiCord-Setup-*.exe

  macos:
    # Apple Silicon only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Installer (BibiCord-*.dmg)
        run: scripts/build-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BibiCord-macos
          path: dist/BibiCord-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
