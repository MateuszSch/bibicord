name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package with FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory dist/BibiCord | Out-Null
          Copy-Item target/release/bibicord.exe dist/BibiCord/BibiCord.exe
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist/BibiCord/
          Compress-Archive dist/BibiCord dist/BibiCord-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BibiCord-windows-x64
          path: dist/BibiCord-windows-x64.zip

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            name: macos-arm64
          - runner: macos-13
            name: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: scripts/bundle-macos.sh
      - run: cd dist && ditto -c -k --keepParent BibiCord.app BibiCord-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BibiCord-${{ matrix.name }}
          path: dist/BibiCord-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
