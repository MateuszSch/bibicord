[package]
name = "bibicord"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
data-encoding = "2.11.1"
directories = "6.0.0"
eframe = "0.37.0"
egui-pop-phosphor = { version = "0.15.0", features = ["fill"] }
ffmpeg-sidecar = "2.7.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
iroh = "1.4.1"
opus = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.2", features = ["macos_14_0"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
embed-resource = "3.0.12"
